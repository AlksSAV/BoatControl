; BoatControl — Seeed Studio XIAO ESP32-C6
; Логика и пороги: ../docs/SPEC.md  |  Пины и питание: ../docs/HARDWARE.md  |  Тулчейн: ../docs/PLATFORM.md

[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

; Отладка идёт через встроенный USB-CDC (ARDUINO_USB_CDC_ON_BOOT=1 в board definition),
; пины D6/D7 (UART0) при этом свободны под светодиоды — см. PLATFORM.md п. 3.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 460800

; Предупреждения не глушим: этот проект про безопасность.
build_unflags =
